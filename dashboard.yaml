        - grid-template-columns: minmax(0,1fr)
      custom_fields:
        content:
          - width: 100%

    card_mod:
      style: |
        .health-grid {
          display: grid;
          grid-template-columns: repeat(3,minmax(0,1fr));
          gap: 16px;
        }

        .health-item {
          display: flex;
          flex-direction: column;
