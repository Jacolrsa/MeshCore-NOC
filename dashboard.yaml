  # ============================================================
  # BATTERY INTELLIGENCE DETAIL PANEL
  # ============================================================
  meshcore_battery_intelligence_readings:
    variables:
      calibrated_voltage_entity: null
      battery_entity: null
      voltage_offset_entity: null
      empty_voltage_entity: null
      full_voltage_entity: null

    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    triggers_update: all

    tap_action:
      action: none

    custom_fields:
      content: |
        [[[
          const numericState = (entityId) => {
            const item = states[entityId];
            const value = Number(item ? item.state : NaN);
            return Number.isFinite(value) ? value : null;
          };

          const raw = entity
            ? numericState(entity.entity_id)
            : null;
          const calibrated = numericState(
            variables.calibrated_voltage_entity
          );
          const battery = numericState(
            variables.battery_entity
          );
          const offset = numericState(
            variables.voltage_offset_entity
          );
          const empty = numericState(
            variables.empty_voltage_entity
          );
          const full = numericState(
            variables.full_voltage_entity
          );
          const tolerance = 0.0006;
          const isDefault =
            offset !== null &&
            empty !== null &&
            full !== null &&
            Math.abs(offset - (-0.816)) <= tolerance &&
            Math.abs(empty - 3.000) <= tolerance &&
            Math.abs(full - 4.200) <= tolerance;
          const status = isDefault
            ? "Default"
            : "Custom";
          const colour = isDefault
            ? "#34a853"
            : "#f9ab00";
          const voltageText = (value) =>
            value === null
              ? "&mdash;"
              : value.toFixed(3) + " V";
          const batteryText =
            battery === null
              ? "&mdash;"
              : Math.round(battery) + "%";

          return `
            <div class="bi-readings">
              <div>
                <span>RAW VOLTAGE</span>
                <strong>${voltageText(raw)}</strong>
              </div>
              <div>
                <span>CALIBRATED VOLTAGE</span>
                <strong>${voltageText(calibrated)}</strong>
              </div>
              <div>
                <span>CALCULATED BATTERY</span>
                <strong>${batteryText}</strong>
              </div>
              <div class="bi-status">
                <span>CALIBRATION STATUS</span>
                <strong style="color:${colour};">
                  <i style="background:${colour};"></i>
                  ${status}
                </strong>
              </div>
            </div>
          `;
        ]]]

    styles:
      card:
        - width: 100%
        - height: 100%
        - box-sizing: border-box
        - border: 1px solid rgba(100,100,100,0.18)
        - border-radius: 12px
        - box-shadow: none
        - padding: 13px 16px
        - background: rgba(245,245,245,0.86)
      grid:
        - width: 100%
        - grid-template-areas: '"content"'
        - grid-template-columns: minmax(0,1fr)
      custom_fields:
        content:
          - width: 100%
          - min-width: 0

    card_mod:
      style: |
        .bi-readings {
          display: grid;
          grid-template-columns: repeat(4,minmax(0,1fr));
          gap: 12px;
          color: #000000;
        }

        .bi-readings > div {
          display: flex;
          flex-direction: column;
          min-width: 0;
          padding-left: 12px;
          border-left: 3px solid #dddddd;
        }

        .bi-readings span {
          font-size: 9px;
          font-weight: 800;
          letter-spacing: 0.7px;
          color: #666666;
        }

        .bi-readings strong {
          margin-top: 4px;
          font-size: 17px;
          line-height: 21px;
        }

        .bi-status strong {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .bi-status i {
          display: block;
          width: 9px;
          height: 9px;
          flex: 0 0 auto;
          border-radius: 50%;
        }

  meshcore_battery_intelligence_reset:
    variables:
      voltage_offset_entity: null
      empty_voltage_entity: null
      full_voltage_entity: null

    icon: mdi:restore
    name: Reset This Repeater
    show_state: false

    tap_action:
      action: call-service
      service: script.meshcore_battery_intelligence_reset_repeater_calibration
      service_data:
        voltage_offset_entity: |
          [[[ return variables.voltage_offset_entity; ]]]
        empty_voltage_entity: |
          [[[ return variables.empty_voltage_entity; ]]]
        full_voltage_entity: |
          [[[ return variables.full_voltage_entity; ]]]
      confirmation:
        text: Reset this repeater's calibration values to the approved defaults?

    styles:
      card:
        - width: 100%
        - height: 100%
        - box-sizing: border-box
        - border: 1px solid rgba(100,100,100,0.18)
        - border-radius: 12px
        - box-shadow: none
        - padding: 12px
        - background: rgba(245,245,245,0.86)
      icon:
        - color: "#ea4335"
        - width: 24px
      name:
        - color: "#c5221f"
        - font-size: 12px
        - font-weight: 800

  # ============================================================
  # NETWORK SUMMARY
  # ============================================================
  meshcore_summary:
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    triggers_update: all
    tap_action: {action: none}
    hold_action: {action: none}
    custom_fields:
      content: |
        [[[
          const nodes = [
            ["ProMicro","sensor.promicro_repeater_bi_calibrated_voltage","sensor.promicro_repeater_bi_battery_percentage"],
            ["Myburgh Park","sensor.myburgh_park_bi_calibrated_voltage","sensor.myburgh_park_bi_battery_percentage"],
            ["Saldanha","sensor.saldanha_repeater_bi_calibrated_voltage","sensor.saldanha_repeater_bi_battery_percentage"],
            ["Vredenburg","sensor.vredenburg_bi_calibrated_voltage","sensor.vredenburg_bi_battery_percentage"],
            ["Vredenburg NE","sensor.vredenburg_ne_bi_calibrated_voltage","sensor.vredenburg_ne_bi_battery_percentage"],
            ["Laguna 2","sensor.laguna2_repeater_bi_calibrated_voltage","sensor.laguna2_bi_battery_percentage"],
            ["ProMicro Test","sensor.promicro_test_repeater_bi_calibrated_voltage","sensor.promicro_test_repeater_bi_battery_percentage"],
            ["Test Solar","sensor.test_solar_repeater_bi_calibrated_voltage","sensor.test_solar_bi_battery_percentage"]];
          const model=nodes.map(([name,vId,bId])=>{const ve=states[vId],be=states[bId],v=Number(ve?ve.state:NaN),b=Number(be?be.state:NaN),vv=!!(ve&&Number.isFinite(v)&&v>=0),valid=!!(vv&&be&&Number.isFinite(b)&&b>=0),age=vv&&ve.last_updated?Math.max(0,Math.floor((Date.now()-new Date(ve.last_updated).getTime())/1000)):Infinity;return{name,v,b,vv,valid,age};});
          let total=0;model.forEach(n=>{if(!n.valid)return;if(n.age>10800)total+=0;else if(n.age>5400)total+=40;else if(n.b<20||n.v<3.30)total+=30;else if(n.b<40||n.v<3.60)total+=55;else if(n.b<70||n.v<3.85)total+=75;else total+=100;});
          const score=Math.round(total/nodes.length),valid=model.filter(n=>n.valid),volts=model.filter(n=>n.vv),online=model.filter(n=>n.vv&&n.age<=10800).length,warnings=valid.filter(n=>n.v<3.60||n.b<40).length;let label="Critical",hc="#c5221f",bc="#ea4335";if(score>=85){label="Excellent";hc="#188038";bc="#34a853"}else if(score>=70){label="Good";hc="#b06000";bc="#fbbc04"}else if(score>=50){label="Warning";hc="#e37400";bc="#ff9800"}const lowB=valid.reduce((a,n)=>!a||n.b<a.b?n:a,null),lowV=volts.reduce((a,n)=>!a||n.v<a.v?n:a,null),avg=(xs,k,d,s)=>xs.length?(xs.reduce((a,n)=>a+n[k],0)/xs.length).toFixed(d)+s:"&mdash;";
          return `<div class="summary"><small>NETWORK HEALTH</small><strong style="color:${hc}">${label}</strong><em>${score}%</em><div class="bar"><i style="width:${score}%;background:${bc}"></i></div><b>&#128994; Online&nbsp;&nbsp;${online}</b><b>&#128308; Offline&nbsp;&nbsp;${nodes.length-online}</b><b>&#128992; Warnings&nbsp;&nbsp;${warnings}</b><span class="divider">Average battery<br><b>${valid.length?Math.round(valid.reduce((a,n)=>a+n.b,0)/valid.length)+"%":"&mdash;"}</b></span><span>Average voltage<br><b>${avg(volts,"v",3," V")}</b></span><span class="divider">Lowest battery<br><b>${lowB?lowB.name+" &middot; "+Math.round(lowB.b)+"%":"&mdash;"}</b></span><span>Lowest voltage<br><b>${lowV?lowV.name+" &middot; "+lowV.v.toFixed(3)+" V":"&mdash;"}</b></span></div>`;
        ]]]
    styles:
      card:
        - width: 100%
        - box-sizing: border-box
        - border: 1px solid rgba(100,100,100,0.20)
        - box-shadow: none
        - border-radius: 12px
        - padding: 15px
        - background: rgba(245,245,245,0.86)
      grid:
        - width: 100%
        - grid-template-areas: '"content"'
        - grid-template-columns: minmax(0,1fr)
      custom_fields:
        content:
          - width: 100%
          - min-width: 0
    card_mod:
      style: |
        .summary{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(11,min-content);gap:9px;color:#000}.summary>small{font-size:10px;font-weight:800;letter-spacing:1px}.summary>strong{font-size:17px}.summary>em{font-size:34px;font-style:normal;font-weight:800;line-height:36px}.bar{height:9px;margin-bottom:6px;overflow:hidden;border-radius:10px;background:#d5d5d5}.bar i{display:block;height:100%;border-radius:10px}.summary>b{font-size:13px}.summary>span{font-size:11px;line-height:18px}.summary .divider{padding-top:8px;border-top:1px solid #ddd}

