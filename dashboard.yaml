  - title: Repeater Details
    path: repeater-test-solar
    subview: true
    panel: true

    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout

        layout:
          width: 100%
          grid-template-columns: repeat(2,minmax(0,1fr))
          grid-template-areas: |
            "header header"
            "voltage battery"
            "statistics statistics"
            "health health"
            "intelligence intelligence"
          column-gap: 16px
          row-gap: 16px
          margin: 16px

        cards:
          - type: custom:button-card
            template: meshcore_detail_header
            entity: sensor.test_solar_repeater_bi_calibrated_voltage
            variables:
              repeater_name: Test Solar
              battery_entity: sensor.test_solar_bi_battery_percentage
            view_layout:
              grid-area: header

          - type: custom:apexcharts-card
            config_templates: meshcore_detail_voltage_chart
            series:
              - entity: sensor.meshcore_23b033ff3a_bat_test_solar
                name: Test Solar Voltage
                color: "#1a73e8"
                transform: |
                  const raw = Number(x);
                  const offset = Number(hass.states["input_number.meshcore_test_solar_voltage_offset"]?.state);
                  if (!Number.isFinite(raw) || !Number.isFinite(offset)) return null;
                  const calibrated = raw + offset;
                  return calibrated >= 2.5 && calibrated <= 5.0 ? calibrated : null;
            view_layout:
              grid-area: voltage

          - type: custom:apexcharts-card
            config_templates: meshcore_detail_battery_chart
            series:
              - entity: sensor.meshcore_23b033ff3a_bat_test_solar
                name: Test Solar Battery
                color: "#34a853"
                transform: |
                  const raw = Number(x);
                  const offset = Number(hass.states["input_number.meshcore_test_solar_voltage_offset"]?.state);
                  const empty = Number(hass.states["input_number.meshcore_test_solar_empty_voltage"]?.state);
                  const full = Number(hass.states["input_number.meshcore_test_solar_full_voltage"]?.state);
                  if (![raw, offset, empty, full].every(Number.isFinite) || full <= empty) return null;
                  const calibrated = raw + offset;
                  if (calibrated < 2.5 || calibrated > 5.0) return null;
                  return Math.min(100, Math.max(0, ((calibrated - empty) / (full - empty)) * 100));
            view_layout:
              grid-area: battery

