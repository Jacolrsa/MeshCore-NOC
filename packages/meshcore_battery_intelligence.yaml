# MeshCore NOC Battery Intelligence foundation
#
# IMPORTANT:
# - Every helper is owned by one repeater; there is no global calibration.
# - The *_bi_* sensors are temporary migration entities.
# - Do not disable or delete legacy calibrated entities until comparison,
#   rollback, entity-registry, and recorder-continuity testing is complete.
# - Template sensors calculate live values only and never rewrite Recorder
#   history.
#
# Default profile metadata: 18650 Li-ion
# Calibration schema version: 1

input_number:
  meshcore_promicro_repeater_voltage_offset:
    name: ProMicro Repeater Voltage Offset
    min: -2.000
    max: 2.000
    step: 0.001
    unit_of_measurement: V
    mode: box

